{% if page.paginator.num_pages > 1 %}<nav class="pagination-bar" aria-label="Paginação"><span>Página {{ page.number }} de {{ page.paginator.num_pages }} · {{ page.paginator.count }} registros</span><div>{% if page.has_previous %}<a class="btn btn-sm btn-outline-secondary" href="?{{ query }}&page={{ page.previous_page_number }}">← Anterior</a>{% endif %}{% if page.has_next %}<a class="btn btn-sm btn-outline-secondary" href="?{{ query }}&page={{ page.next_page_number }}">Próxima →</a>{% endif %}</div></nav>{% endif %}
