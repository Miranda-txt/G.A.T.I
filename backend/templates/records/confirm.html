{% extends 'base.html' %}{% block content %}<section class="panel form-panel"><div class="eyebrow">CONFIRMAÇÃO</div><h1>{{ action }}</h1><h2>{{ obj }}</h2><p class="muted">{{ explanation }}</p><form method="post">{% csrf_token %}{% if version %}<input type="hidden" name="versao" value="{{ version }}">{% endif %}{% if reason %}<label for="reason" class="form-label">Justificativa</label><textarea id="reason" class="form-control" name="reason" required minlength="10" maxlength="2000" rows="4"></textarea>{% endif %}<div class="form-actions"><button class="btn btn-primary" type="submit">Confirmar: {{ action|lower }}</button><a class="btn btn-light" href="/">Voltar ao início</a></div></form></section>{% endblock %}
