{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><h1>Editar termo #{{ term.pk }}</h1><p class="muted">Disponível apenas enquanto o termo estiver em edição.</p></div></div><section class="panel form-panel wide-form"><form method="post">{% csrf_token %}<input type="hidden" name="versao" value="{{ term.versao }}"><label class="form-label" for="text">Texto do termo</label><textarea id="text" name="texto" class="form-control" rows="16" required maxlength="30000">{{ term.texto }}</textarea><div class="form-actions"><button class="btn btn-primary">Salvar texto</button><a href="{% url 'term_detail' term.pk %}" class="btn btn-light">Voltar</a></div></form>{% if term.processo.estado == 'EM_EDICAO' %}<hr><a href="{% url 'term_items' term.pk %}">Editar seleção e condições dos itens →</a>{% endif %}</section>{% endblock %}
