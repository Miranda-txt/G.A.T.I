name: Núcleo patrimonial
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: gati
          POSTGRES_PASSWORD: senha-exclusiva-ci-sintetica
          POSTGRES_DB: gati
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gati -d gati"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      GATI_ENV: test
      GATI_SECRET_KEY: chave-sintetica-exclusiva-para-ci-sem-acesso-a-nenhum-ambiente-real
      PGDATABASE: gati
      PGUSER: gati
      PGPASSWORD: senha-exclusiva-ci-sintetica
      PGHOST: 127.0.0.1
      PGPORT: 5432
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r requirements.lock
      - name: Instalar dependencias experimentais T01 apenas no runner de testes
        run: >-
          python -m pip install --only-binary=:all: --no-deps -r tests/fixtures/term_v2/requirements-spike.txt
      - name: Instalar WeasyPrint apenas para comparação PDF T01
        timeout-minutes: 3
        run: >-
          python -m pip install --only-binary=:all: weasyprint==70.0
      - run: python -m pip check
      - run: python -m ruff check --config pyproject.toml .
      - name: Validar schema cliente experimental T01 (Node sem pacotes externos)
        run: |
          node --check tests/fixtures/term_v2/editor_spike/model.js
          node --check tests/fixtures/term_v2/editor_spike/editor.js
          node --test tests/fixtures/term_v2/editor_spike/model.test.cjs
      - name: Instalar dependencias Tiptap OSS isoladas T01 (experimentais)
        working-directory: backend/tests/fixtures/term_v2/tiptap_poc
        timeout-minutes: 3
        run: |
          sha256sum --check package-lock.sha256
          npm ci --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json
          npm audit --omit=dev --audit-level=high
      - name: Testar contrato Tiptap OSS (RED-GREEN)
        working-directory: backend/tests/fixtures/term_v2/tiptap_poc
        timeout-minutes: 2
        run: node --test rich_schema.test.mjs
      - name: Auditar e instalar ferramentas de build T01 pelo lock versionado sem scripts
        working-directory: backend/tests/fixtures/term_v2/tiptap_poc/build_tools
        timeout-minutes: 3
        run: |
          node --version
          npm --version
          sha256sum --check package-lock.sha256
          npm ci --include=optional --ignore-scripts --no-audit --no-fund
          sha256sum --check package-lock.sha256
          git diff --exit-code -- package-lock.json package-lock.sha256
          npm sbom --package-lock-only --sbom-format=cyclonedx > sbom.json
          status=0
          npm audit --json --audit-level=high > audit.json || status=$?
          cat audit.json
          test "$status" -eq 0
          test "$(node node_modules/esbuild/bin/esbuild --version)" = "0.27.0"
      - name: Preservar lock e auditoria do build T01
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gati-term-v2-build-lock
          path: |
            backend/tests/fixtures/term_v2/tiptap_poc/build_tools/package-lock.json
            backend/tests/fixtures/term_v2/tiptap_poc/build_tools/package-lock.sha256
            backend/tests/fixtures/term_v2/tiptap_poc/build_tools/sbom.json
            backend/tests/fixtures/term_v2/tiptap_poc/build_tools/audit.json
          if-no-files-found: error
          retention-days: 30
      - name: Empacotar Tiptap visual para Chromium sem dependencias remotas em runtime
        working-directory: backend/tests/fixtures/term_v2/tiptap_poc
        timeout-minutes: 3
        run: |
          node --check visual_app.mjs
          node build_tools/node_modules/esbuild/bin/esbuild visual_app.mjs --bundle --platform=browser --format=iife --target=es2022 --outfile=dist/visual.bundle.js
          test -s dist/visual.bundle.js
      - name: Preservar lock experimental Tiptap para auditoria
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gati-term-v2-tiptap-lock
          path: backend/tests/fixtures/term_v2/tiptap_poc/package-lock.json
          if-no-files-found: ignore
          retention-days: 30
      - run: python -m ruff format --config pyproject.toml --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py collectstatic --noinput
      - name: Gerar e validar OpenAPI
        run: python manage.py spectacular --api-version v1 --file ../docs/openapi.yml --validate --fail-on-warn
      - name: Impedir OpenAPI vazio ou sem endpoints da API v1
        run: >-
          python -c "from pathlib import Path; import yaml;
          schema=yaml.safe_load(Path('../docs/openapi.yml').read_text(encoding='utf-8'));
          paths=schema.get('paths', {});
          assert paths and any(p.startswith('/api/v1/') and p != '/api/v1/schema/' for p in paths),
          'OpenAPI sem endpoints da API v1'"
      - name: Publicar OpenAPI gerado como artefato
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gati-openapi
          path: docs/openapi.yml
          if-no-files-found: error
          retention-days: 30
      - run: python -m pytest --cov=gati --cov-report=json:coverage.json --junitxml=test-results.xml
      - run: python ../scripts/check_coverage.py coverage.json
      - name: Validar build Docker para Render sem segredos nem Neon
        working-directory: .
        run: docker build -f backend/Dockerfile backend
      - name: Medir renderer T01 em processos isolados (Linux)
        timeout-minutes: 3
        run: |
          set -euo pipefail
          for scenario in minimo ativos_maximos signatarios_maximos maximo_combinado; do
            python tests/fixtures/term_v2/benchmark_spike.py --case "$scenario" --output "$RUNNER_TEMP/term-v2" --repetitions 10
          done
      - name: Validar PDF/A-2b com veraPDF independente
        timeout-minutes: 5
        env:
          VERAPDF_IMAGE: verapdf/cli:v1.30.4
        run: |
          set -euo pipefail
          docker pull "$VERAPDF_IMAGE"
          image_id="$(docker image inspect --format '{{.Id}}' "$VERAPDF_IMAGE")"
          docker image inspect --format '{{json .RepoDigests}}' "$VERAPDF_IMAGE" | tee "$RUNNER_TEMP/term-v2/verapdf-image.json"
          for scenario in minimo ativos_maximos signatarios_maximos maximo_combinado; do
            code=0
            docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --memory 512m --cpus 1 --pids-limit 256 -v "$RUNNER_TEMP/term-v2:/data:ro" "$image_id" --flavour 2b --format xml "$scenario.pdf" > "$RUNNER_TEMP/term-v2/$scenario.xml" 2> "$RUNNER_TEMP/term-v2/$scenario.stderr.log" || code=$?
            status="$(python tests/fixtures/term_v2/verapdf_report.py "$RUNNER_TEMP/term-v2/$scenario.xml" "$code")"
            printf '%s: %s (exit=%s)\n' "$scenario" "$status" "$code" | tee -a "$RUNNER_TEMP/term-v2/verapdf-status.txt"
          done
      - name: Medir PDF rico T01 com dois motores em processos separados
        timeout-minutes: 4
        run: |
          set -euo pipefail
          for motor in reportlab weasyprint; do
            python tests/fixtures/term_v2/rich_pdf_benchmark.py --engine "$motor" --repetitions 5 --output "$RUNNER_TEMP/term-v2"
          done
      - name: Classificar PDF/A-2b dos PDFs ricos usando veraPDF independente
        timeout-minutes: 5
        env:
          VERAPDF_IMAGE: verapdf/cli:v1.30.4
        run: |
          set -euo pipefail
          image_id="$(docker image inspect --format '{{.Id}}' "$VERAPDF_IMAGE")"
          for motor in reportlab weasyprint; do
            code=0
            docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --memory 512m --cpus 1 --pids-limit 256 -v "$RUNNER_TEMP/term-v2:/data:ro" "$image_id" --flavour 2b --format xml "rico-$motor.pdf" > "$RUNNER_TEMP/term-v2/rico-$motor.xml" 2> "$RUNNER_TEMP/term-v2/rico-$motor.stderr.log" || code=$?
            status="$(python tests/fixtures/term_v2/verapdf_report.py "$RUNNER_TEMP/term-v2/rico-$motor.xml" "$code")"
            printf 'rico-%s: %s (exit=%s)\n' "$motor" "$status" "$code" | tee -a "$RUNNER_TEMP/term-v2/verapdf-status.txt"
          done
      - name: Publicar evidencias sinteticas T01
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gati-term-v2-renderer-evidence
          path: ${{ runner.temp }}/term-v2/
          if-no-files-found: ignore
          retention-days: 30
