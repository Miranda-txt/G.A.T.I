name: Núcleo patrimonial
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: gati
          POSTGRES_PASSWORD: senha-exclusiva-ci-sintetica
          POSTGRES_DB: gati
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gati -d gati"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      GATI_ENV: test
      GATI_SECRET_KEY: chave-sintetica-exclusiva-para-ci-sem-acesso-a-nenhum-ambiente-real
      PGDATABASE: gati
      PGUSER: gati
      PGPASSWORD: senha-exclusiva-ci-sintetica
      PGHOST: 127.0.0.1
      PGPORT: 5432
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r requirements.lock
      - name: Instalar dependencias experimentais T01 apenas no runner de testes
        run: >-
          python -m pip install --only-binary=:all: --no-deps -r tests/fixtures/term_v2/requirements-spike.txt
      - run: python -m pip check
      - run: python -m ruff check --config pyproject.toml .
      - name: Validar schema cliente experimental T01 (Node sem pacotes externos)
        run: |
          node --check tests/fixtures/term_v2/editor_spike/model.cjs
          node --check tests/fixtures/term_v2/editor_spike/editor.js
          node --test tests/fixtures/term_v2/editor_spike/model.test.cjs
      - run: python -m ruff format --config pyproject.toml --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py collectstatic --noinput
      - name: Gerar e validar OpenAPI
        run: python manage.py spectacular --api-version v1 --file ../docs/openapi.yml --validate --fail-on-warn
      - name: Impedir OpenAPI vazio ou sem endpoints da API v1
        run: >-
          python -c "from pathlib import Path; import yaml;
          schema=yaml.safe_load(Path('../docs/openapi.yml').read_text(encoding='utf-8'));
          paths=schema.get('paths', {});
          assert paths and any(p.startswith('/api/v1/') and p != '/api/v1/schema/' for p in paths),
          'OpenAPI sem endpoints da API v1'"
      - name: Publicar OpenAPI gerado como artefato
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gati-openapi
          path: docs/openapi.yml
          if-no-files-found: error
          retention-days: 30
      - run: python -m pytest --cov=gati --cov-report=json:coverage.json --junitxml=test-results.xml
      - run: python ../scripts/check_coverage.py coverage.json
      - name: Validar build Docker para Render sem segredos nem Neon
        working-directory: .
        run: docker build -f backend/Dockerfile backend
      - name: Medir renderer T01 em processos isolados (Linux)
        timeout-minutes: 3
        run: |
          set -euo pipefail
          for scenario in minimo ativos_maximos signatarios_maximos maximo_combinado; do
            python tests/fixtures/term_v2/benchmark_spike.py --case "$scenario" --output "$RUNNER_TEMP/term-v2" --repetitions 10
          done
      - name: Validar PDF/A-2b com veraPDF independente
        timeout-minutes: 5
        env:
          VERAPDF_IMAGE: verapdf/cli:v1.30.4
        run: |
          set -euo pipefail
          docker pull "$VERAPDF_IMAGE"
          image_id="$(docker image inspect --format '{{.Id}}' "$VERAPDF_IMAGE")"
          docker image inspect --format '{{json .RepoDigests}}' "$VERAPDF_IMAGE" | tee "$RUNNER_TEMP/term-v2/verapdf-image.json"
          for scenario in minimo ativos_maximos signatarios_maximos maximo_combinado; do
            code=0
            docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --memory 512m --cpus 1 --pids-limit 256 -v "$RUNNER_TEMP/term-v2:/data:ro" "$image_id" --flavour 2b --format xml "$scenario.pdf" > "$RUNNER_TEMP/term-v2/$scenario.xml" 2> "$RUNNER_TEMP/term-v2/$scenario.stderr.log" || code=$?
            status="$(python tests/fixtures/term_v2/verapdf_report.py "$RUNNER_TEMP/term-v2/$scenario.xml" "$code")"
            printf '%s: %s (exit=%s)\n' "$scenario" "$status" "$code" | tee -a "$RUNNER_TEMP/term-v2/verapdf-status.txt"
          done
      - name: Publicar evidencias sinteticas T01
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gati-term-v2-renderer-evidence
          path: ${{ runner.temp }}/term-v2/
          if-no-files-found: ignore
          retention-days: 30
