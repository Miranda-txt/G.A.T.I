name: Núcleo patrimonial
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: gati
          POSTGRES_PASSWORD: senha-exclusiva-ci-sintetica
          POSTGRES_DB: gati
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gati -d gati"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      GATI_ENV: test
      GATI_SECRET_KEY: chave-sintetica-exclusiva-para-ci-sem-acesso-a-nenhum-ambiente-real
      PGDATABASE: gati
      PGUSER: gati
      PGPASSWORD: senha-exclusiva-ci-sintetica
      PGHOST: 127.0.0.1
      PGPORT: 5432
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m ruff check --config pyproject.toml .
      - run: python -m ruff format --config pyproject.toml --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py collectstatic --noinput
      - run: python manage.py spectacular --file ../docs/openapi.yml --validate --fail-on-warn
      - run: python -m pytest --cov=gati --cov-report=json:coverage.json --junitxml=test-results.xml
      - run: python ../scripts/check_coverage.py coverage.json
