name: Segurança - SAST, SCA e segredos
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  sast-sca:
    name: Auditoria Python e dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Instalar ferramentas de segurança fixadas
        run: python -m pip install --disable-pip-version-check 'pip-audit==2.10.1' 'bandit==1.9.4'
      - name: SCA - auditoria do requirements.lock
        run: python -m pip_audit --no-deps -r backend/requirements.lock
      - name: SAST - Bandit (média/alta, confiança média/alta)
        run: python -m bandit -r backend/gati -ll -ii
  secrets:
    name: Segredos no Git
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detectar credenciais e tokens versionados
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0, Node 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
